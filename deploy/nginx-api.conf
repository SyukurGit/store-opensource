# ==============================================================
# Nginx Configuration for api.digimest.tech (VPS Backend)
# ==============================================================
# Letakkan di: /etc/nginx/sites-available/api.digimest.tech
# Lalu link ke: /etc/nginx/sites-enabled/
# ==============================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.digimest.tech;

    # Jika Anda menggunakan Cloudflare SSL, Anda bisa gunakan Cloudflare Origin Certificate
    # atau pasang Certbot Let's Encrypt: certbot --nginx -d api.digimest.tech

    # Client body limit untuk upload/request payload
    client_max_body_size 16M;

    # Gzip Compression
    gzip on;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket & Long-polling headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP Headers (Terutama jika di balik Cloudflare)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jika di balik Cloudflare Proxy, gunakan header CF-Connecting-IP
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
