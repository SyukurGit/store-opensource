<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Digimest</title>
  <link rel="icon" type="image/png" href="/logo/digimest_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="payment-container" style="max-width: 420px; margin-top: 6rem;">
    <div class="payment-card" style="text-align: left;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="display: inline-block; background: #ffffff; padding: 10px 18px; border-radius: 12px; margin-bottom: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,0.18);">
          <img src="/logo/digimest_petak.png" alt="Digimest Admin" style="height: 52px; width: auto; object-fit: contain; display: block;">
        </div>
        <h1 style="font-size: 1.4rem; font-weight: 800; color: #fff;">Panel Admin Digimest</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Masukkan kredensial admin untuk masuk.</p>
      </div>

      <div id="loginError" style="display: none; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 0.75rem; color: #f87171; font-size: 0.85rem; margin-bottom: 1rem;">
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="admin" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnLogin" class="btn-submit" style="margin-top: 0.5rem;">
          Masuk ke Panel Admin ➔
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="/" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none;">← Kembali ke Toko</a>
      </div>
    </div>
  </div>

  <script src="/js/api-config.js"></script>
  <script>
    // Auto-check if already logged in
    (async () => {
      const token = localStorage.getItem('digimest_admin_token') || localStorage.getItem('Digimest_admin_token') || localStorage.getItem('storeku_admin_token');
      const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
      try {
        const statsUrl = window.digimestApi ? window.digimestApi('/api/admin/stats') : '/api/admin/stats';
        const res = await fetch(statsUrl, { headers });
        if (res.ok) {
          window.location.href = '/admin';
        }
      } catch (e) {}
    })();

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Memverifikasi...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const loginUrl = window.digimestApi ? window.digimestApi('/api/admin/login') : '/api/admin/login';
        const res = await fetch(loginUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          if (data.token) {
            localStorage.setItem('digimest_admin_token', data.token);
            localStorage.setItem('storeku_admin_token', data.token);
          }
          window.location.href = '/admin';
        } else {
          errBox.textContent = data.error || 'Username atau password salah';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Gagal terhubung ke server: ' + err.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Masuk ke Panel Admin ➔';
      }
    });
  </script>
</body>
</html>
